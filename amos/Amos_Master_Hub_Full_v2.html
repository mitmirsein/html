<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amos Master Hub - 4 Styles (Full Versions)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background: #e5e7eb; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        .header-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0,0,0,0.1); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; z-index: 1000; }
        .logo { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 8px; color: #111; }
        .dot { width: 12px; height: 12px; background: #0071e3; border-radius: 50%; }
        .tabs { display: flex; gap: 8px; background: #eee; padding: 4px; border-radius: 10px; }
        .tab-btn { padding: 8px 16px; border: none; background: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; color: #555; transition: 0.2s; }
        .tab-btn.active { background: #fff; color: #000; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        .viewer { flex: 1; position: relative; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        iframe.active { display: block; }
        .loader { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fff; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 500; }
        .loader.visible { opacity: 1; }
    </style>
</head>
<body>
    <header class="header-nav">
        <div class="logo"><div class="dot"></div> AMOS SYNOPSIS CENTER</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('claude', this)">Claude Editorial</button>
            <button class="tab-btn" onclick="switchTab('apple', this)">Apple Modern</button>
            <button class="tab-btn" onclick="switchTab('notion', this)">Notion Knowledge</button>
            <button class="tab-btn" onclick="switchTab('academic', this)">Academic Minimalist</button>
        </div>
        <div style="font-size: 10px; font-weight: 700; background: #000; color: #fff; padding: 3px 8px; border-radius: 20px;">FULL V4.1</div>
    </header>
    <div class="viewer">
        <div id="loader" class="loader">Switching Style...</div>
        <iframe id="iframe-claude" class="active" src="Amos_Total_Claude_Report.html"></iframe>
        <iframe id="iframe-apple" src="Amos_Total_Apple_Report.html"></iframe>
        <iframe id="iframe-notion" src="Amos_Total_Notion_Report.html"></iframe>
        <iframe id="iframe-academic" src="Amos_Total_Academic_Report.html"></iframe>
    </div>
    <script>
        function switchTab(id, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const loader = document.getElementById('loader');
            loader.classList.add('visible');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            document.getElementById('iframe-' + id).classList.add('active');
            setTimeout(() => { loader.classList.remove('visible'); }, 400);
        }
    </script>
</body>
</html>
